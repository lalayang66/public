<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>火雞肉飯文賢店 · 線上點餐</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #8B1E1E;
    --paper: #FFFBF7;
    --mustard: #F2C879;
    --stamp: #C0392B;
    --charcoal: #2B2925;
    --line: #E7DFD0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    font-family: 'Noto Sans TC', sans-serif;
    color: var(--charcoal);
  }
  .display { font-family: 'Noto Serif TC', serif; }

  /* ---- Config bar (edit store name / table number) ---- */
  .topbar {
    position: sticky; top: 0; z-index: 20;
    background: var(--ink);
  }
  .topbar-inner {
    max-width: 480px; margin: 0 auto;
    padding: 12px 16px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .store-name {
    font-weight: 700; font-size: 18px;color: #FFFFFF;
  }
  .table-tag { font-size: 11px; color: rgba(255,255,255,0.5); margin-left: 8px; }

  .tabs {
    display: flex; gap: 8px; padding: 16px 16px 8px;
    max-width: 480px; margin: 0 auto; overflow-x: auto;
  }
  .tab-btn {
    padding: 6px 16px; border-radius: 999px; font-size: 14px; font-weight: 500;
    border: 1px solid var(--ink); background: transparent; color: var(--ink);
    white-space: nowrap; cursor: pointer;
  }
  .tab-btn.active { background: var(--ink); color: var(--paper); }

  .menu-list { max-width: 480px; margin: 0 auto; padding: 8px 16px 160px; display: flex; flex-direction: column; gap: 12px; }

  .item-card {
    background: #fff; border: 1px solid var(--line); border-radius: 14px;
    padding: 12px; display: flex; gap: 12px; align-items: center;
  }
  .item-card.sold-out { opacity: 0.5; }
  .thumb {
    width: 64px; height: 64px; border-radius: 10px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px; color: #fff; background-size: cover; background-position: center;
  }
  .item-info { flex: 1; min-width: 0; }
  .item-name { font-family: 'Noto Serif TC', serif; font-size: 17px; font-weight: 700; }
  .item-desc { font-size: 12px; color: #8a8378; margin-top: 2px; }
  .item-price { font-size: 14px; font-weight: 700; color: var(--stamp); margin-top: 4px; }
  .sold-out-badge {
    display: inline-block; font-size: 11px; background: var(--stamp); color: #fff;
    padding: 1px 8px; border-radius: 999px; margin-top: 4px;
  }
  .qty-controls { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .qty-btn {
    width: 28px; height: 28px; border-radius: 999px; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700;
  }
  .qty-btn.add { background: var(--ink); color: #fff; }
  .qty-btn.remove { background: #F1ECE0; color: var(--ink); }
  .qty-btn:disabled { background: #ddd; color: #999; cursor: not-allowed; }
  .qty-num { width: 18px; text-align: center; font-weight: 700; font-size: 14px; }

  .cart-bar {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 20;
    padding: 0 16px 16px;
  }
  .cart-inner {
    max-width: 480px; margin: 0 auto;
    background: var(--ink); color: #fff; border-radius: 16px; padding: 14px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.2);
  }
  .cart-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .cart-total { font-family: 'Noto Serif TC', serif; font-size: 18px; font-weight: 700; color: var(--mustard); }
  .submit-btn {
    width: 100%; padding: 10px; border-radius: 12px; border: none; cursor: pointer;
    background: var(--mustard); color: var(--ink); font-weight: 700; font-size: 14px;
  }
  .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }

  .stamp-overlay {
    position: fixed; inset: 0; z-index: 30; display: none;
    align-items: center; justify-content: center; pointer-events: none;
  }
  .stamp-overlay.show { display: flex; }
  .stamp-box {
    padding: 20px 28px; border-radius: 10px; border: 4px solid var(--stamp);
    color: var(--stamp); font-family: 'Noto Serif TC', serif; font-size: 26px; font-weight: 900;
    background: rgba(250,246,239,0.94);
    animation: stampIn 0.5s ease-out;
  }
  @keyframes stampIn {
    0% { opacity: 0; transform: scale(2.2) rotate(-14deg); }
    40% { opacity: 1; transform: scale(0.95) rotate(-10deg); }
    60% { transform: scale(1.05) rotate(-12deg); }
    100% { opacity: 1; transform: scale(1) rotate(-10deg); }
  }

  .empty-msg { text-align: center; color: #999; padding: 40px 0; font-size: 14px; }
  .table-input {
    border: none; background: transparent; color: rgba(255,255,255,0.7);
    font-size: 11px; width: 40px; border-bottom: 1px solid rgba(255,255,255,0.3);
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div>
      <span class="store-name display">火雞肉飯文賢店</span>
      <span class="table-tag">取餐時間 <select id="tableInput" class="table-input"></select></span>
    </div>
  </div>
</div>

<div id="tabs" class="tabs"></div>
<div id="menuList" class="menu-list">
  <div class="empty-msg">菜單載入中...</div>
</div>

<div class="cart-bar" id="cartBar" style="display:none;">
  <div class="cart-inner">
    <div class="cart-row">
      <span id="cartCount">已選 0 項</span>
      <span class="cart-total" id="cartTotal">$0</span>
    </div>
    <textarea id="orderNote" placeholder="備註(選填,例如:少辣、不要香菜)" style="width:100%; margin-bottom:8px; padding:8px; border-radius:8px; border:none; font-size:13px; resize:none; height:44px; box-sizing:border-box;"></textarea>
<label style="display:flex; align-items:center; gap:6px; color:#fff; font-size:13px; margin-bottom:8px;">
  <input type="checkbox" id="needUtensils" checked style="width:16px; height:16px;" />
  需要提供餐具
</label>
    <button class="submit-btn" id="submitBtn">送出點菜單</button>
  </div>
</div>

<div class="stamp-overlay" id="stampOverlay">
  <div class="stamp-box">已送單</div>
</div>

<script>
// ====== 這裡填入你的 Supabase 專案資訊 ======
const SUPABASE_URL = "https://sjbcepsbkgfpczoxqwlc.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_zWX2dXB_bNiiTatEpmHB0w_blhyrqAR";
// ==========================================

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let allItems = [];
let categories = [];
let activeCat = null;
let cart = {}; // id -> qty

const CATEGORY_COLORS = {
  "招牌": "#B33F3F", "湯品": "#5C8A8A", "小菜": "#7A8450", "飲料": "#C98A3A"
};
const CATEGORY_EMOJI = {
  "招牌": "🍚", "湯品": "🍲", "小菜": "🥗", "飲料": "🥤"
};
function thumbStyle(item) {
  if (item.photo_url) {
    return `background-image:url('${item.photo_url}')`;
  }
  const color = CATEGORY_COLORS[item.category] || "#999";
  return `background:${color}`;
}
function thumbEmoji(item) {
  return item.photo_url ? "" : (CATEGORY_EMOJI[item.category] || "🍽️");
}

async function loadMenu() {
  const { data, error } = await sb.from("menu_items").select("*").order("category").order("sort_order");
  if (error) {
    document.getElementById("menuList").innerHTML =
      `<div class="empty-msg">菜單載入失敗:${error.message}</div>`;
    return;
  }
  allItems = data || [];
  categories = [...new Set(allItems.map(i => i.category))];
  if (!activeCat && categories.length) activeCat = categories[0];
  renderTabs();
  renderMenu();
}

function renderTabs() {
  const tabs = document.getElementById("tabs");
  tabs.innerHTML = categories.map(c =>
    `<button class="tab-btn ${c === activeCat ? 'active' : ''}" data-cat="${c}">${c}</button>`
  ).join("");
  tabs.querySelectorAll(".tab-btn").forEach(btn => {
    btn.onclick = () => { activeCat = btn.dataset.cat; renderTabs(); renderMenu(); };
  });
}

function renderMenu() {
  const list = document.getElementById("menuList");
  const items = allItems.filter(i => i.category === activeCat);
  if (!items.length) {
    list.innerHTML = `<div class="empty-msg">這個分類目前沒有品項</div>`;
    return;
  }
  list.innerHTML = items.map(item => {
    const qty = cart[item.id] || 0;
    const soldOut = !item.is_available;
    return `
      <div class="item-card ${soldOut ? 'sold-out' : ''}">
        <div class="thumb" style="${thumbStyle(item)}">${thumbEmoji(item)}</div>
        <div class="item-info">
          <div class="item-name display">${item.name}</div>
          ${item.description ? `<div class="item-desc">${item.description}</div>` : ""}
          <div class="item-price">$${item.price}</div>
          ${soldOut ? `<div class="sold-out-badge">本日售完</div>` : ""}
        </div>
        <div class="qty-controls">
          ${qty > 0 ? `
            <button class="qty-btn remove" data-id="${item.id}" data-action="remove">−</button>
            <span class="qty-num">${qty}</span>
          ` : ""}
          <button class="qty-btn add" data-id="${item.id}" data-action="add" ${soldOut ? "disabled" : ""}>+</button>
        </div>
      </div>
    `;
  }).join("");

  list.querySelectorAll("[data-action]").forEach(btn => {
    btn.onclick = () => {
      const id = btn.dataset.id;
      if (btn.dataset.action === "add") cart[id] = (cart[id] || 0) + 1;
      else cart[id] = Math.max(0, (cart[id] || 0) - 1);
      renderMenu();
      renderCart();
    };
  });
}

function renderCart() {
  const entries = Object.entries(cart).filter(([, q]) => q > 0);
  const cartBar = document.getElementById("cartBar");
  if (!entries.length) { cartBar.style.display = "none"; return; }
  cartBar.style.display = "block";
  let totalQty = 0, total = 0;
  entries.forEach(([id, q]) => {
    const item = allItems.find(i => i.id === id);
    if (!item) return;
    totalQty += q;
    total += q * item.price;
  });
  document.getElementById("cartCount").textContent = `已選 ${totalQty} 項`;
  document.getElementById("cartTotal").textContent = `$${total}`;
}

document.getElementById("submitBtn").addEventListener("click", async () => {
  const entries = Object.entries(cart).filter(([, q]) => q > 0);
  if (!entries.length) return;
  const tableNo = document.getElementById("tableInput").value.trim() || "未指定時間";
  const items = entries.map(([id, q]) => {
    const item = allItems.find(i => i.id === id);
    return { name: item.name, qty: q, price: item.price };
  });

  const btn = document.getElementById("submitBtn");
  btn.disabled = true; btn.textContent = "送出中...";

  const note = document.getElementById("orderNote").value.trim();
const needUtensils = document.getElementById("needUtensils").checked;

const { error } = await sb.from("orders").insert({
    table_no: tableNo,
    items: items,
    status: "pending",
    note: note || null,
    need_utensils: needUtensils
  });

  btn.disabled = false; btn.textContent = "送出點菜單";

  if (error) {
    alert("送單失敗:" + error.message);
    return;
  }

  cart = {};
  document.getElementById("orderNote").value = "";
  document.getElementById("needUtensils").checked = true;
  renderMenu();
  renderCart();
  const overlay = document.getElementById("stampOverlay");
  overlay.classList.add("show");
  setTimeout(() => overlay.classList.remove("show"), 1400);
});

  async function loadPickupOptions() {
  const { data } = await sb.from("settings").select("min_wait_minutes, open_time, close_time").eq("id", 1).single();
  const waitMin = (data && data.min_wait_minutes) || 20;
  const openTime = (data && data.open_time) || "11:00";
  const closeTime = (data && data.close_time) || "20:00";

  const now = new Date();
  const today = new Date(now); today.setHours(0,0,0,0);

  const [openH, openM] = openTime.split(":").map(Number);
  const [closeH, closeM] = closeTime.split(":").map(Number);
  const openDate = new Date(today); openDate.setHours(openH, openM, 0, 0);
  const closeDate = new Date(today); closeDate.setHours(closeH, closeM, 0, 0);

  let start = new Date(now.getTime() + waitMin * 60000);
  start.setSeconds(0, 0);
  const rem = start.getMinutes() % 5;
  if (rem) start.setMinutes(start.getMinutes() + (5 - rem));
  if (start < openDate) start = new Date(openDate);

  const select = document.getElementById("tableInput");
  select.innerHTML = "";

  if (start >= closeDate) {
    const opt = document.createElement("option");
    opt.textContent = "今日已打烊";
    opt.disabled = true;
    select.appendChild(opt);
    document.getElementById("submitBtn").disabled = true;
    return;
  }

  for (let t = new Date(start); t < closeDate; t = new Date(t.getTime() + 5 * 60000)) {
    const hh = String(t.getHours()).padStart(2, "0");
    const mm = String(t.getMinutes()).padStart(2, "0");
    const opt = document.createElement("option");
    opt.value = `${hh}:${mm}`;
    opt.textContent = `${hh}:${mm}`;
    select.appendChild(opt);
  }
}
loadPickupOptions();
loadMenu();
</script>
</body>
</html>
